# Exact real-NVIDIA release gate. Provider-side dstack task.
#
# DO NOT apply this configuration from a polecat session.
# Never run `dstack apply` here. The 0.21.2 control plane is at
# http://127.0.0.1:3001, project main. Port 3000 is Dagster and is not dstack.
#
# Schema: official task reference
# https://dstack.ai/docs/reference/dstack.yml/task.md
#   type, name, digest-pinned image, repos.url+hash,
#   resources.gpu.vendor/count/memory/compute_capability, spot_policy,
#   max_price, max_duration, idle_duration, retry.
#
# Sol cost-input, preview only:
#   echo n | dstack apply --project main -f deploy/dstack/remote-gpu-nvidia.dstack.yml
# Apply only when the plan shows 2x NVIDIA, CC 7.5+, under max_price 2.50.
# Expected spend about 1–3 USD if the gate finishes in under an hour.
#
# Hardware PASS is recorded only when the paid host checks out repos.hash
# (the integrated 13.2 + 13.3 + 13.4 candidate), ASTERISM_PINNED_SHA matches,
# ASTERISM_NVIDIA_E2E_RUNNER names an executable from that checkout, and
# scripts/harness-remote-gpu-nvidia.sh judges the guest→mesh→provider path.
# CPU reference and host-direct CUDA cannot PASS.

type: task
name: asterism-remote-gpu-nvidia-gate

image: docker.io/nvidia/cuda:13.0.0-devel-ubuntu24.04@sha256:435220c0fef35cbf712e11999f8670a83835ef3cdd18564e5e8122f83078c88c
docker: true

repos:
  - url: https://github.com/medicalissue/asterism.git
    hash: "07d3b5648dc57674ed31934afd19c03624668c70"
    path: /dstack/run

working_dir: /dstack/run

env:
  - ASTERISM_SOURCE_ONLY=0
  - ASTERISM_PINNED_SHA=07d3b5648dc57674ed31934afd19c03624668c70
  - ASTERISM_NVIDIA_E2E_RUNNER=/dstack/run/scripts/lib/nvidia-e2e-runner.sh
  - CARGO_HOME=/dstack/cargo
  - RUSTUP_HOME=/dstack/rustup
  - PATH=/dstack/cargo/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

commands:
  - test "$(git rev-parse HEAD)" = "$ASTERISM_PINNED_SHA"
  - git rev-parse HEAD
  - git rev-parse HEAD^{tree}
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/asterism-rustup-init.sh
  - sh /tmp/asterism-rustup-init.sh -y --no-modify-path --profile minimal
  - cargo --version
  - cc --version
  - docker version
  - nvidia-smi
  - bash scripts/harness-remote-gpu-nvidia.sh

resources:
  cpu: 8
  memory: 32GB
  disk: 100GB
  gpu:
    vendor: nvidia
    count: 2
    memory: 16GB..
    compute_capability: 7.5

spot_policy: on-demand
max_price: 2.50
max_duration: 1h
idle_duration: 5m
retry: false
