<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --asterism-canvas: #090A0D;
    --asterism-ink: #F2F3F5;
    --asterism-amber: #F2B84B;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 640px;
    background: var(--asterism-canvas);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .mark {
    display: flex; align-items: baseline; gap: 26px;
    color: var(--asterism-ink);
  }
  .star {
    font-family: Menlo, monospace;
    font-size: 132px; font-weight: 700;
    line-height: 1;
    position: relative; top: 18px;
  }
  .word {
    font-family: system-ui, ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    font-size: 108px; font-weight: 500;
    letter-spacing: -3px; line-height: 1;
  }
  .rule {
    width: 132px; height: 1px;
    background: rgba(242, 184, 75, 0.62);
    margin: 44px 0 40px;
  }
  .pitch {
    font-family: system-ui, ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    font-size: 34px; font-weight: 400;
    letter-spacing: -0.2px;
    color: rgba(242, 243, 245, 0.74);
  }
  .foot {
    position: absolute; bottom: 74px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 21px; letter-spacing: 0.4px;
    color: rgba(242, 243, 245, 0.34);
  }
</style>
<div class="mark"><span class="star">*</span><span class="word">Asterism</span></div>
<div class="rule"></div>
<div class="pitch">Run your AI agents 24/7 on hardware you already own.</div>
<div class="foot">asterism.run</div>
