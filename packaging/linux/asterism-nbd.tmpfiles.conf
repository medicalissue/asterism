# The root-owned NBD critical section. The helper holds a flock on the lock
# file and writes atomic root-owned claims under the state directory, so
# neither may be writable by the daemon's account. Both live on tmpfs, which
# is why they are recreated at every boot rather than shipped as files.
d /run/asterism-nbd 0700 root root -
f /run/lock/asterism-nbd.lock 0600 root root -
