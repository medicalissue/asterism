# The GUI is deliberately *not* a member of the root workspace: it pulls a
# heavy, platform-specific dependency tree (webkit, objc, tao) that has no
# business slowing `cargo test` on the daemon down, and it is driven by the
# tauri CLI rather than plain cargo. The empty `[workspace]` table detaches
# it from the workspace above. `asterism-core` is still consumed by path, so
# the wire protocol cannot drift between the CLI and the app.
[workspace]

[package]
name = "asterism-gui"
description = "Asterism menu-bar app — a tray client for the local astd daemon."
version = "0.0.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/medicalissue/asterism"
publish = false

[[bin]]
name = "asterism-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
asterism-core = { path = "../crates/asterism-core" }
anyhow = "1"
# The window's form crosses the IPC boundary as JSON, in both directions.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Two plugins, each for one thing the app cannot do itself: tell the user an
# action failed, and own the LaunchAgent plist behind "Start at Login".
# Everything else that needs the system — a Terminal window, a confirmation,
# the website — is a subprocess. (tauri-plugin-dialog was tried for the
# confirmation and does not work here; see src/applescript.rs.)
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
