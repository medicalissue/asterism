# cargo-deny is the Rust half of the release supply-chain gate. Keep this
# policy small and reviewable: an exception belongs in
# docs/supply-chain-exceptions.md with its removal condition, never as a broad
# warning or a workflow ignore.

[advisories]
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are exact local source edges, not mutable
# registry requirements. cargo-deny otherwise treats their omitted version as
# a wildcard, including the GUI's private dependency on asterism-core.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
