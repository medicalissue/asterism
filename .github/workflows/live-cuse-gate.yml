name: Linux live CUSE lifecycle gate

on:
  push:
    branches:
      - "polecat/**/as-glji.5**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ASTERISM_CUSE_TARGET_COMMIT: 747a6b9d4c2a300244f28be438f136af1fe15545
  ASTERISM_CUSE_TARGET_TREE: 21f91cb23eafab1240181f977cd1d8e7078f9e47

jobs:
  live-cuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 peeled commit

      - id: gate
        name: Run fail-closed live CUSE gate
        env:
          ASTERISM_CUSE_EVIDENCE_DIR: ${{ runner.temp }}/live-cuse-evidence
        run: |
          set +e
          bash scripts/gate-live-cuse.sh
          gate_rc=$?
          echo "exit_code=${gate_rc}" >>"$GITHUB_OUTPUT"
          exit 0

      - id: evidence
        name: Upload immutable gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 commit
        with:
          name: live-cuse-747a6b9d
          path: ${{ runner.temp }}/live-cuse-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Publish evidence identity
        if: always()
        run: |
          {
            echo '## Linux live CUSE lifecycle gate'
            echo
            echo "- target commit: \`${ASTERISM_CUSE_TARGET_COMMIT}\`"
            echo "- target tree: \`${ASTERISM_CUSE_TARGET_TREE}\`"
            echo "- gate exit: \`${{ steps.gate.outputs.exit_code }}\`"
            echo "- artifact id: \`${{ steps.evidence.outputs.artifact-id }}\`"
            echo "- artifact digest: \`${{ steps.evidence.outputs.artifact-digest }}\`"
            echo "- artifact URL: ${{ steps.evidence.outputs.artifact-url }}"
            echo "- NVIDIA hardware claim: \`false\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Enforce fail-closed verdict
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.exit_code }}" != 0 ]; then
            echo "live CUSE gate blocked; inspect the uploaded exact evidence" >&2
            exit 1
          fi
