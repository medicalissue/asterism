# Cutting a release.
#
# A tag is the only thing that starts this, and the tag is the only thing
# that names the version. The job builds the binaries, writes SHA256SUMS
# beside them, and then — before anything is published — installs the exact
# artifacts it just built with the exact script users run, from a local
# directory over file://. If that install does not produce a working `ast`
# reporting the tagged version, and a signed `astd-vz` from the same build
# carrying the entitlements Virtualization.framework demands, nothing is
# published.
#
# Dry runs: workflow_dispatch builds, checksums and tests, and stops short
# of publishing. Use it to prove a release candidate before tagging it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for a dry run, e.g. v0.1.0"
        required: true
        type: string

# Read by default. Only the publish job creates a release, and only that job
# gets the token that can — a build or a test step has no business being able
# to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # macos-14 is Apple silicon, which is the target these binaries are for.
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: version
        name: Take the version from the tag, and check the tree agrees
        run: |
          set -eu
          version="${{ inputs.version || github.ref_name }}"
          case "$version" in
            v*) ;;
            *) echo "version must look like v0.1.0, got ${version}" >&2; exit 1 ;;
          esac
          # The tag says v0.1.0; Cargo.toml has to say 0.1.0, or the binary
          # would report a version nobody can install.
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${version#v}" != "$cargo_version" ]; then
            echo "tag ${version} does not match the workspace version ${cargo_version}" >&2
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      # Pinned by digest like the rest, which means the ref no longer names
      # the toolchain — hence the explicit input.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 peeled commit

      # The build id is stamped into the binaries at compile time and is what
      # ties `ast`, `astd` and the desktop app to one build. Naming the commit
      # here is what makes a published artifact traceable to a source
      # revision without trusting a tag that can be moved.
      - name: Build
        env:
          ASTERISM_BUILD_ID: ${{ github.sha }}
          ASTERISM_UPDATE_PUBKEY: ${{ vars.ASTERISM_UPDATE_PUBKEY }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = push ] && [ -z "$ASTERISM_UPDATE_PUBKEY" ]; then
            echo "tagged releases require the ASTERISM_UPDATE_PUBKEY repository variable" >&2
            exit 1
          fi
          npm --prefix gui/ui ci --no-audit --no-fund
          npm --prefix gui/ui run build
          cargo build --release --locked \
            --package asterism-cli --package asterism-daemon --package asterism-vz
          cargo build --release --locked --manifest-path gui/Cargo.toml

      # Signing is the last thing done to these bytes, and `strip` rewrites
      # them — so stripping happens here and signing happens after it.
      - name: Strip
        run: strip -x target/release/ast target/release/astd target/release/astd-vz

      # A Developer ID certificate, when the repository has one, lives in a
      # keychain this job creates and destroys. Without it the helper is
      # signed ad-hoc, which is all the `curl | sh` install path needs:
      # nothing that script downloads is quarantined, so Gatekeeper never
      # assesses it, and both entitlements the helper carries are
      # unrestricted. What ad-hoc does not survive is a *browser* download
      # of the tarball off the releases page, which is quarantined and
      # therefore assessed — that is what the certificate below buys.
      - name: Import the signing certificate, if there is one
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_SIGN_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -eu
          if [ -z "${CERT_P12}" ]; then
            echo "no MACOS_SIGN_CERT_P12 — astd-vz will be signed ad-hoc"
            echo "identity=-" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "${IDENTITY}" ] || { echo "MACOS_SIGN_CERT_P12 is set but MACOS_SIGN_IDENTITY is not" >&2; exit 1; }
          keychain="${RUNNER_TEMP}/asterism-signing.keychain-db"
          keychain_pw="$(uuidgen)"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode >"${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "${RUNNER_TEMP}/cert.p12"
          # Without this, codesign stops to ask for the keychain password on
          # a runner with nobody to ask.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "identity=${IDENTITY}" >>"$GITHUB_OUTPUT"

      - name: Sign
        env:
          ASTERISM_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -eu
          # One recipe, and it is the one a developer runs locally: build,
          # sign with the entitlements, and prove the entitlement is on the
          # binary afterwards. --sign-only because the build above was
          # --locked and the strip above must not be undone by a rebuild.
          scripts/sign-vz.sh --release --sign-only
          # ast and astd need no entitlement, but a quarantined binary is
          # assessed whatever it carries — so when there is a real identity,
          # everything in the tarball is signed with it.
          if [ "$ASTERISM_SIGN_IDENTITY" != "-" ]; then
            for bin in ast astd; do
              codesign --force --sign "$ASTERISM_SIGN_IDENTITY" \
                --options runtime --timestamp "target/release/${bin}"
            done
          fi

      # Notarization is what makes a quarantined binary run on a machine
      # that has never seen it. A bare Mach-O cannot be stapled — only
      # bundles, disk images and packages can — so the ticket lives on
      # Apple's side, keyed to the code directory hash of each binary in the
      # zip submitted here, and Gatekeeper finds it online. Submitting the
      # zip is therefore not a detour around the tarball: it is how these
      # exact bytes get a ticket.
      - name: Notarize, if there are credentials
        if: ${{ steps.signing.outputs.identity != '-' }}
        env:
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          if [ -z "${NOTARY_KEY_P8}" ]; then
            echo "signed with a Developer ID but no notary credentials — a browser download will still be blocked" >&2
            exit 1
          fi
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode >"${RUNNER_TEMP}/notary.p8"
          staging="${RUNNER_TEMP}/notarize"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp target/release/ast target/release/astd target/release/astd-vz "$staging/"
          ditto -c -k --sequesterRsrc "$staging" "${RUNNER_TEMP}/notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" \
            --key "${RUNNER_TEMP}/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          rm -rf "${RUNNER_TEMP}/notary.p8" "${RUNNER_TEMP}/notarize.zip" "$staging"

      - name: Package
        env:
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          target=darwin-arm64
          dist="dist/${version}"
          mkdir -p "$dist"
          # COPYFILE_DISABLE keeps macOS tar from smuggling ._ AppleDouble
          # entries into the tarball, which would change the digest for no
          # reason anyone could see. The code signature is inside the Mach-O
          # itself, not in an extended attribute, so it travels with the
          # bytes and survives the round trip.
          cp packaging/update.sh target/release/asterism-update
          chmod 755 target/release/asterism-update
          COPYFILE_DISABLE=1 tar -czf "${dist}/asterism-${version}-${target}.tar.gz" \
            -C target/release ast astd astd-vz asterism-update

          # The app stays a macOS bundle, signed and replaced as a bundle.
          # Its web assets are embedded by tauri::generate_context!, so this
          # bundle has no moving web resource directory to forget.
          app="${RUNNER_TEMP}/Asterism.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp gui/target/release/asterism-gui "$app/Contents/MacOS/asterism-gui"
          cp gui/icons/icon.icns "$app/Contents/Resources/icon.icns"
          cat >"$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>asterism-gui</string>
            <key>CFBundleIdentifier</key><string>run.asterism.desktop</string>
            <key>CFBundleName</key><string>Asterism</string>
            <key>CFBundleShortVersionString</key><string>${version#v}</string>
            <key>CFBundleVersion</key><string>${version#v}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
          identity="${{ steps.signing.outputs.identity }}"
          if [ "$identity" = "-" ]; then
            codesign --force --deep --sign - "$app"
          else
            codesign --force --deep --options runtime --timestamp --sign "$identity" "$app"
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode >"${RUNNER_TEMP}/app-notary.p8"
            ditto -c -k --sequesterRsrc "$app" "${RUNNER_TEMP}/Asterism.app.zip"
            xcrun notarytool submit "${RUNNER_TEMP}/Asterism.app.zip" \
              --key "${RUNNER_TEMP}/app-notary.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" --wait
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
            rm -f "${RUNNER_TEMP}/app-notary.p8" "${RUNNER_TEMP}/Asterism.app.zip"
          fi
          # Preserve the app tarball as the updater payload. The DMG below is
          # a second, manual-install presentation of this exact signed app;
          # the app is not rebuilt or signed again between the two.
          COPYFILE_DISABLE=1 tar -czf "${dist}/Asterism-${version}-darwin-arm64.app.tar.gz" \
            -C "${RUNNER_TEMP}" Asterism.app

          dmg_root="${RUNNER_TEMP}/dmg-root"
          dmg="${dist}/Asterism-${version}-darwin-arm64.dmg"
          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"
          cp -R "$app" "$dmg_root/Asterism.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create -quiet -volname Asterism -srcfolder "$dmg_root" \
            -format UDZO -ov "$dmg"
          rm -rf "$dmg_root"

          # The app ticket was stapled before the image was assembled. A DMG
          # is a separate notarizable container and needs its own submitted
          # and stapled ticket for Gatekeeper to validate it offline.
          if [ "$identity" != "-" ]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode >"${RUNNER_TEMP}/dmg-notary.p8"
            xcrun notarytool submit "$dmg" \
              --key "${RUNNER_TEMP}/dmg-notary.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            rm -f "${RUNNER_TEMP}/dmg-notary.p8"
          fi

      - name: Render the tap formula for this tag
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          # The tag's source tarball is what the formula points at; GitHub
          # only serves it once the tag is pushed, so a dry run renders with
          # a placeholder digest and says so.
          if [ "${{ github.event_name }}" = "push" ]; then
            ./scripts/render-formula.sh "$version" >"dist/${version}/asterism.rb"
          else
            ./scripts/render-formula.sh "$version" DRY-RUN-NO-DIGEST >"dist/${version}/asterism.rb"
          fi

      - name: Checksum every artifact
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          node scripts/generate-supply-chain-metadata.mjs --out "dist/${version}" --version "$version"
          # Every artifact, not just the tarball — asterism.rb is checked
          # against this file too when the installer stands up a local tap.
          cli="asterism-${version}-darwin-arm64.tar.gz"
          app="Asterism-${version}-darwin-arm64.app.tar.gz"
          dmg="Asterism-${version}-darwin-arm64.dmg"
          sbom="asterism-${version}-sbom.cdx.json"
          licenses="asterism-${version}-licenses.json"
          ( cd "dist/${version}" && shasum -a 256 "$cli" "$app" "$dmg" "$sbom" "$licenses" asterism.rb >SHA256SUMS )
          cli_sha="$(shasum -a 256 "dist/${version}/${cli}" | awk '{print $1}')"
          app_sha="$(shasum -a 256 "dist/${version}/${app}" | awk '{print $1}')"
          base="https://github.com/${{ github.repository }}/releases/download/${version}"
          scripts/render-release-manifest.sh stable "$version" \
            "${version#v}+${{ github.sha }}" darwin-arm64 \
            "${base}/${cli}" "$cli_sha" "${base}/${app}" "$app_sha" \
            >"dist/${version}/RELEASE.json"
          cat "dist/${version}/SHA256SUMS"

      - name: Sign the update manifest
        env:
          UPDATE_KEY_B64: ${{ secrets.UPDATE_MINISIGN_SECRET_KEY }}
          UPDATE_PUBKEY: ${{ vars.ASTERISM_UPDATE_PUBKEY }}
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          if [ -z "$UPDATE_KEY_B64" ]; then
            if [ "${{ github.event_name }}" = push ]; then
              echo "tagged releases require UPDATE_MINISIGN_SECRET_KEY" >&2
              exit 1
            fi
            echo "dry run: no update signing key, so no publishable signature was produced"
            printf 'unsigned dry run\n' >"dist/${version}/RELEASE.json.sig"
            exit 0
          fi
          [ -n "$UPDATE_PUBKEY" ] || { echo "an update signing key requires ASTERISM_UPDATE_PUBKEY" >&2; exit 1; }
          command -v minisign >/dev/null || brew install minisign
          printf '%s' "$UPDATE_KEY_B64" | base64 --decode >"${RUNNER_TEMP}/update.key"
          # Legacy wire format keeps the detached signature verifiable by
          # both minisign and signify; verification policy is unchanged.
          minisign -S -l -W -s "${RUNNER_TEMP}/update.key" \
            -m "dist/${version}/RELEASE.json" -x "dist/${version}/RELEASE.json.sig"
          minisign -Vm "dist/${version}/RELEASE.json" \
            -x "dist/${version}/RELEASE.json.sig" -P "$UPDATE_PUBKEY"
          rm -f "${RUNNER_TEMP}/update.key"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  # Linux has a native Cloud Hypervisor payload, so it is built on both
  # supported runner architectures rather than cross-compiled from macOS.
  # The packer verifies the pinned helper and emits the flat layout consumed
  # by packaging/install.sh.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: version
        name: Take the version from the tag
        run: |
          set -eu
          version="${{ inputs.version || github.ref_name }}"
          case "$version" in v*) ;; *) echo "version must start with v" >&2; exit 1 ;; esac
          echo "version=${version}" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 peeled commit
      - name: Build Linux CLI and daemon
        env:
          ASTERISM_BUILD_ID: ${{ github.sha }}
        run: cargo build --release --locked --package asterism-cli --package asterism-daemon
      - name: Package Linux runtime
        env:
          ASTERISM_BUILD_ID: ${{ github.sha }}
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          mkdir -p "dist/${version}"
          scripts/package-linux.sh "$version" "dist/${version}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  verify-linux:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, linux-arm64]
    runs-on: ${{ matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: version
        run: echo "version=${{ inputs.version || github.ref_name }}" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-${{ matrix.target }}
          path: dist
      - name: Verify Linux archive layout and notices
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          archive="dist/${version}/asterism-${version}-${{ matrix.target }}.tar.gz"
          [ -f "$archive" ]
          for member in ast astd cloud-hypervisor virtiofsd asterism-update \
            guest-gpu/bin/asterism-gpu-guest \
            guest-gpu/lib/libcuda.so.1.0.0 guest-gpu/lib/libcuda.so.1 \
            guest-gpu/lib/libcuda.so \
            share/asterism/asterism-nbd share/asterism/linux-components.env \
            share/asterism/licenses/LICENSE-APACHE \
            share/asterism/licenses/LICENSE-MIT share/asterism/licenses/NOTICE \
            LICENSE-APACHE LICENSE-MIT NOTICE; do
            tar -tzf "$archive" | grep -qx "$member" || {
              echo "Linux archive is missing $member" >&2
              exit 1
            }
          done
          if tar -tzf "$archive" | grep -q '^bin/'; then
            echo "Linux archive unexpectedly contains a bin/ prefix" >&2
            exit 1
          fi
          sh -n packaging/install.sh packaging/asterism-nbd
          bash -n scripts/package-linux.sh

      - name: Install and execute the exact Linux release artifact
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          prefix="${RUNNER_TEMP}/asterism-linux-prefix"
          export ASTERISM_BASE_URL="file://${PWD}/dist"
          export ASTERISM_VERSION="$version"
          export ASTERISM_PREFIX="$prefix"
          export ASTERISM_YES=1
          sh packaging/install.sh
          [ -x "$prefix/bin/ast" ]
          [ -x "$prefix/bin/astd" ]
          [ -x "$prefix/bin/cloud-hypervisor" ]
          [ -x "$prefix/bin/virtiofsd" ]
          [ -x "$prefix/libexec/asterism/asterism-update" ]
          "$prefix/bin/cloud-hypervisor" --version | grep -F 'v53.0'
          "$prefix/bin/ast" --version
          sh packaging/install.sh --uninstall
          [ ! -e "$prefix/bin/ast" ]

  # Install what was just built, with the script users run, on a clean
  # runner. The artifacts are served over file:// from the download
  # directory, so this exercises the real download-verify-install-upgrade-
  # uninstall path against the real bytes.
  verify:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: The installer's own suite, against a fake release
        run: bash scripts/install-test.sh

      - name: The updater's signed transaction suite
        run: bash scripts/update-test.sh

      - name: The astd-vz version/build verifier regression
        run: bash scripts/release-vz-version-test.sh

      - name: The desktop bundle has the release identity and a valid signature
        run: |
          set -eu
          version="${{ needs.build.outputs.version }}"
          archive="dist/${version}/Asterism-${version}-darwin-arm64.app.tar.gz"
          app="${RUNNER_TEMP}/candidate/Asterism.app"
          mkdir -p "${RUNNER_TEMP}/candidate"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/candidate"
          codesign --verify --deep --strict "$app"
          got="$("$app/Contents/MacOS/asterism-gui" --version | sed -n 's/^build  *//p')"
          want="${version#v}+${{ github.sha }}"
          [ "$got" = "$want" ] || { echo "app build ${got}, expected ${want}" >&2; exit 1; }

      - name: The manual installer is the exact mounted release DMG
        run: |
          set -eu
          version="${{ needs.build.outputs.version }}"
          dmg="dist/${version}/Asterism-${version}-darwin-arm64.dmg"
          expected="$(cat <<NAMES
          Asterism-${version}-darwin-arm64.app.tar.gz
          Asterism-${version}-darwin-arm64.dmg
          RELEASE.json
          RELEASE.json.sig
          SHA256SUMS
          asterism-${version}-darwin-arm64.tar.gz
          asterism-${version}-licenses.json
          asterism-${version}-sbom.cdx.json
          asterism.rb
          NAMES
          )"
          actual="$(find "dist/${version}" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          [ "$actual" = "$expected" ] || {
            echo "release artifact names differ" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            exit 1
          }
          ( cd "dist/${version}" && shasum -a 256 -c SHA256SUMS )
          hdiutil verify -quiet "$dmg"
          mount="${RUNNER_TEMP}/asterism-dmg"
          mkdir -p "$mount"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach -quiet "$mount"' EXIT
          app="$mount/Asterism.app"
          [ -L "$mount/Applications" ]
          [ "$(readlink "$mount/Applications")" = /Applications ]
          codesign --verify --deep --strict "$app"
          output="$("$app/Contents/MacOS/asterism-gui" --version)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qFx "version   ${version#v}"
          printf '%s\n' "$output" | grep -qFx "build     ${version#v}+${{ github.sha }}"

      # Is what was just packed the thing that was built, and is it one build?
      # The digest checks below prove the bytes came through intact; this
      # proves they were one build to begin with — a tarball assembled from
      # two of them passes every digest check there is.
      - name: The release candidate's identity gate
        run: bash scripts/rc.sh --artifact dist --version "${{ needs.build.outputs.version }}" identity

      - name: The build id names the commit this was built from
        run: |
          set -eu
          version="${{ needs.build.outputs.version }}"
          prefix="${RUNNER_TEMP}/id-prefix"
          ASTERISM_YES=1 ASTERISM_PREFIX="$prefix" \
            ASTERISM_BASE_URL="file://${PWD}/dist" ASTERISM_VERSION="$version" \
            sh packaging/install.sh >/dev/null
          got="$("${prefix}/bin/ast" version | sed -n 's/^build  *//p')"
          echo "build id: ${got}"
          want="${version#v}+${{ github.sha }}"
          [ "$got" = "$want" ] || { echo "expected ${want}" >&2; exit 1; }
          ASTERISM_YES=1 ASTERISM_PREFIX="$prefix" sh packaging/install.sh --uninstall >/dev/null

      - name: Install the exact artifacts this run built
        run: |
          set -eu
          version="${{ needs.build.outputs.version }}"
          prefix="${RUNNER_TEMP}/asterism-prefix"
          export ASTERISM_YES=1
          export ASTERISM_PREFIX="$prefix"
          export ASTERISM_BASE_URL="file://${PWD}/dist"
          export ASTERISM_VERSION="$version"

          sh packaging/install.sh

          # The version the binary reports is the version that was tagged,
          # or the artifact and the tag have come apart.
          got="$("${prefix}/bin/ast" --version)"
          echo "ast --version: ${got}"
          [ "$got" = "ast ${version#v}" ] || { echo "expected 'ast ${version#v}'" >&2; exit 1; }

          # astd takes no arguments — running it starts a daemon — so the
          # check on it is that it arrived, executable, built for this
          # machine's architecture.
          [ -x "${prefix}/bin/astd" ] || { echo "astd is not executable" >&2; exit 1; }
          file "${prefix}/bin/astd" | grep -q 'arm64' || { echo "astd is not an arm64 binary" >&2; exit 1; }

          # And astd-vz, the helper that owns every Virtualization.framework
          # guest. Absent, it is not that vz degrades — `ast create --backend
          # vz` has nothing to spawn, so the release can only ever run QEMU.
          # These are the checks astd's own probe() makes before it will use
          # the backend, made here against the installed artifact.
          [ -x "${prefix}/bin/astd-vz" ] || { echo "astd-vz was not installed" >&2; exit 1; }
          file "${prefix}/bin/astd-vz" | grep -q 'arm64' || { echo "astd-vz is not an arm64 binary" >&2; exit 1; }

          # One build, three binaries: a helper from another build would
          # speak a control protocol this astd does not.
          got_vz="$("${prefix}/bin/astd-vz" --version)"
          echo "astd-vz --version: ${got_vz}"
          scripts/check-release-vz-version.sh \
            "${prefix}/bin/astd-vz" "${version#v}" "${version#v}+${{ github.sha }}"

          # The signature has to cover the bytes as installed — tar, the
          # installer's copy-and-rename, and `strip` are all things that
          # would have broken it — and it has to carry both entitlements, or
          # VZ refuses to create the machine.
          codesign --verify --strict "${prefix}/bin/astd-vz" ||
            { echo "the signature on the installed astd-vz does not verify" >&2; exit 1; }
          ents="$(codesign -d --entitlements - "${prefix}/bin/astd-vz" 2>&1)"
          echo "$ents"
          for ent in com.apple.security.virtualization com.apple.security.network.client; do
            case "$ents" in
              *"$ent"*) ;;
              *) echo "the installed astd-vz does not carry ${ent}" >&2; exit 1 ;;
            esac
          done

          # The catalog is compiled in, so this needs no daemon and no
          # network — it is the cheapest proof the binary actually runs.
          "${prefix}/bin/ast" images | grep -q 'debian:13'

          # Re-running changes nothing.
          sh packaging/install.sh | tee /tmp/second-run.txt
          grep -q "already installed: ${version}" /tmp/second-run.txt

          # And the machine can be put back the way it was found — every
          # binary the release put there, the helper included.
          sh packaging/install.sh --uninstall
          for bin in ast astd astd-vz; do
            [ ! -e "${prefix}/bin/${bin}" ] || { echo "uninstall left ${bin} behind" >&2; exit 1; }
          done
          [ ! -e "${prefix}/libexec/asterism/asterism-update" ] || \
            { echo "uninstall left asterism-update behind" >&2; exit 1; }

      - name: Refuse a tampered artifact
        run: |
          set -eu
          version="${{ needs.build.outputs.version }}"
          cp -R dist "${RUNNER_TEMP}/tampered"
          printf 'tampered' >>"${RUNNER_TEMP}/tampered/${version}/asterism-${version}-darwin-arm64.tar.gz"
          if ASTERISM_YES=1 \
             ASTERISM_PREFIX="${RUNNER_TEMP}/tampered-prefix" \
             ASTERISM_BASE_URL="file://${RUNNER_TEMP}/tampered" \
             ASTERISM_VERSION="$version" \
             sh packaging/install.sh; then
            echo "a tampered artifact was installed" >&2
            exit 1
          fi
          [ ! -e "${RUNNER_TEMP}/tampered-prefix/bin/ast" ]

  publish:
    needs: [build, verify, linux, verify-linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The one job that writes anything, and the only one holding a token
    # that can.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-linux-x86_64
          path: dist/linux-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-linux-arm64
          path: dist/linux-arm64
      - name: Add Linux artifacts to the release checksum set
        run: |
          set -eu
          version="${{ needs.build.outputs.version }}"
          for target in linux-x86_64 linux-arm64; do
            cp "dist/${target}/${version}/asterism-${version}-${target}.tar.gz" "dist/${version}/"
            cat "dist/${target}/${version}/SHA256SUMS.${target}" >>"dist/${version}/SHA256SUMS"
          done

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: repo
      - name: Include Linux archives in the signed update manifest
        env:
          UPDATE_KEY_B64: ${{ secrets.UPDATE_MINISIGN_SECRET_KEY }}
          UPDATE_PUBKEY: ${{ vars.ASTERISM_UPDATE_PUBKEY }}
        run: |
          set -eu
          version="${{ needs.build.outputs.version }}"
          base="https://github.com/${{ github.repository }}/releases/download/${version}"
          cli="asterism-${version}-darwin-arm64.tar.gz"
          app="Asterism-${version}-darwin-arm64.app.tar.gz"
          linux_x86="asterism-${version}-linux-x86_64.tar.gz"
          linux_arm="asterism-${version}-linux-arm64.tar.gz"
          cli_sha="$(sha256sum "dist/${version}/${cli}" | awk '{print $1}')"
          app_sha="$(sha256sum "dist/${version}/${app}" | awk '{print $1}')"
          linux_x86_sha="$(sha256sum "dist/${version}/${linux_x86}" | awk '{print $1}')"
          linux_arm_sha="$(sha256sum "dist/${version}/${linux_arm}" | awk '{print $1}')"
          repo/scripts/render-release-manifest.sh stable "$version" \
            "${version#v}+${{ github.sha }}" darwin-arm64 \
            "${base}/${cli}" "$cli_sha" "${base}/${app}" "$app_sha" \
            "${base}/${linux_x86}" "$linux_x86_sha" \
            "${base}/${linux_arm}" "$linux_arm_sha" \
            >"dist/${version}/RELEASE.json"
          if [ -z "$UPDATE_KEY_B64" ]; then
            echo "tagged releases require UPDATE_MINISIGN_SECRET_KEY" >&2
            exit 1
          fi
          [ -n "$UPDATE_PUBKEY" ] || { echo "an update signing key requires ASTERISM_UPDATE_PUBKEY" >&2; exit 1; }
          command -v minisign >/dev/null || sudo apt-get install -y minisign
          printf '%s' "$UPDATE_KEY_B64" | base64 --decode >"${RUNNER_TEMP}/update.key"
          minisign -S -l -W -s "${RUNNER_TEMP}/update.key" \
            -m "dist/${version}/RELEASE.json" -x "dist/${version}/RELEASE.json.sig"
          minisign -Vm "dist/${version}/RELEASE.json" \
            -x "dist/${version}/RELEASE.json.sig" -P "$UPDATE_PUBKEY"
          rm -f "${RUNNER_TEMP}/update.key"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version="${{ needs.build.outputs.version }}"
          notes="$(mktemp)"
          {
            echo "## Install"
            echo
            echo '```console'
            echo "\$ curl -fsSL https://asterism.run/install.sh | ASTERISM_VERSION=${version} sh"
            echo '```'
            echo
            echo "macOS on Apple silicon and Linux on x86-64 or arm64. Everything else builds from source:"
            echo "\`ASTERISM_METHOD=source\`."
            echo
            echo "The platform tarballs hold \`ast\`, the \`astd\` daemon, and the native"
            echo "helper for that platform, plus the signed-channel updater. Install"
            echo "it with the command above; the installer selects the host architecture and"
            echo "configures Linux's NBD privilege boundary. On macOS it also clears the"
            echo "browser quarantine from the signed helper before it starts a guest."
            echo
            echo "The desktop app is a separate download."
            echo "Open \`Asterism-${version}-darwin-arm64.dmg\` and drag Asterism to Applications."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat "dist/${version}/SHA256SUMS"
            echo '```'
            echo
            echo "\`asterism.rb\` is the Homebrew formula for this tag; copy it into"
            echo "the tap as \`Formula/asterism.rb\`."
          } >"$notes"

          gh release create "$version" \
            --title "$version" \
            --notes-file "$notes" \
            "dist/${version}/asterism-${version}-darwin-arm64.tar.gz" \
            "dist/${version}/asterism-${version}-linux-x86_64.tar.gz" \
            "dist/${version}/asterism-${version}-linux-arm64.tar.gz" \
            "dist/${version}/Asterism-${version}-darwin-arm64.app.tar.gz" \
            "dist/${version}/Asterism-${version}-darwin-arm64.dmg" \
            "dist/${version}/SHA256SUMS" \
            "dist/${version}/RELEASE.json" \
            "dist/${version}/RELEASE.json.sig" \
            "dist/${version}/asterism-${version}-sbom.cdx.json" \
            "dist/${version}/asterism-${version}-licenses.json" \
            "dist/${version}/asterism.rb"
