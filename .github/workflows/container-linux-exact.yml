name: Linux container exact lifecycle gate

on:
  push:
    branches:
      - "polecat/**/as-lvf.21.2+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-linux-exact-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_SHA: 8158557033f5ab9fecec7d2872c9aac53f6fa695
  TARGET_TREE: eef559d425aca9116746940aa0c0247583195caa
  CARGO_TERM_COLOR: always

jobs:
  exact-container-lifecycle:
    name: exact native-container lifecycle on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # This checkout is an observer only. Product artifacts are built from
      # the detached, SHA-and-tree-checked source worktree below.
      - name: Check out observer workflow
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: container-linux-exact

      - name: Initialize immutable evidence and exact source
        run: |
          set -Eeuo pipefail
          evidence="${RUNNER_TEMP}/container-linux-evidence"
          exact="${RUNNER_TEMP}/exact-source"
          mkdir -p "$evidence"
          {
            echo "result=pending"
            echo "target_sha=$TARGET_SHA"
            echo "target_tree=$TARGET_TREE"
            echo "observer_sha=$GITHUB_SHA"
            echo "observer_ref=$GITHUB_REF"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } >"$evidence/provenance.txt"
          trap 'code=$?; printf "blocker_stage=materialize\nblocker_exit=%s\n" "$code" >>"$evidence/provenance.txt"; exit "$code"' ERR
          git worktree add --detach "$exact" "$TARGET_SHA"
          test "$(git -C "$exact" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$exact" rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          echo "EXACT_SOURCE=$exact" >>"$GITHUB_ENV"
          echo "GATE_EVIDENCE=$evidence" >>"$GITHUB_ENV"

      - name: Install native-container and build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'code=$?; printf "blocker_stage=host-prerequisites\nblocker_exit=%s\n" "$code" >>"$GATE_EVIDENCE/provenance.txt"; exit "$code"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 e2fsprogs gnome-keyring iproute2 jq libcap-ng-dev \
            libseccomp-dev libsecret-tools lsof pkg-config procps slirp4netns \
            uidmap
          debugfs="$(command -v debugfs || true)"
          test -n "$debugfs"
          test -x "$debugfs"
          # The exact target's shared resolver accepts this absolute fallback.
          # Keep the product check intact: wire the Ubuntu package binary into
          # that host capability path, then prove the actual executable.
          if [ "$debugfs" != /usr/local/bin/debugfs ]; then
            test ! -e /usr/local/bin/debugfs
            sudo ln -s "$debugfs" /usr/local/bin/debugfs
          fi
          test -x /usr/local/bin/debugfs
          {
            printf 'package_path=%s\n' "$debugfs"
            printf 'product_fallback=%s\n' "$(readlink -f /usr/local/bin/debugfs)"
            dpkg-query -W -f='package=${Package}\nversion=${Version}\n' e2fsprogs
            /usr/local/bin/debugfs -V
            sha256sum "$(readlink -f /usr/local/bin/debugfs)"
          } >"$GATE_EVIDENCE/debugfs-preflight.txt" 2>&1

      - name: Build the shipped payload from only the exact source
        env:
          ASTERISM_BUILD_ID: ${{ env.TARGET_SHA }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/exact-target
        run: |
          set -Eeuo pipefail
          trap 'code=$?; printf "blocker_stage=exact-build\nblocker_exit=%s\n" "$code" >>"$GATE_EVIDENCE/provenance.txt"; exit "$code"' ERR
          cd "$EXACT_SOURCE"
          cargo build --release --locked \
            --package asterism-cli --package asterism-daemon
          version="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          dist="${RUNNER_TEMP}/dist/${version}"
          scripts/package-linux.sh "$version" "$dist"
          archive="${dist}/asterism-${version}-linux-x86_64.tar.gz"
          test -f "$archive"
          sha256sum "$archive" >"$GATE_EVIDENCE/release-archive.sha256"
          echo "GATE_VERSION=$version" >>"$GITHUB_ENV"
          echo "GATE_DIST=${RUNNER_TEMP}/dist" >>"$GITHUB_ENV"

      - name: Install through the exact shipped installer
        run: |
          set -Eeuo pipefail
          trap 'code=$?; printf "blocker_stage=shipped-install\nblocker_exit=%s\n" "$code" >>"$GATE_EVIDENCE/provenance.txt"; exit "$code"' ERR
          prefix="${RUNNER_TEMP}/asterism-container-prefix"
          ASTERISM_VERSION="$GATE_VERSION" \
          ASTERISM_PREFIX="$prefix" \
          ASTERISM_BASE_URL="file://${GATE_DIST}" \
          ASTERISM_YES=1 \
            sh "$EXACT_SOURCE/packaging/install.sh"
          for binary in ast astd; do
            test -x "$prefix/bin/$binary"
            sha256sum "$prefix/bin/$binary"
          done >"$GATE_EVIDENCE/installed-binaries.sha256"
          test -s "$prefix/share/asterism/install-receipt.env"
          cp "$prefix/share/asterism/install-receipt.env" "$GATE_EVIDENCE/"
          echo "GATE_PREFIX=$prefix" >>"$GITHUB_ENV"

      - name: Prepare fail-closed Ubuntu host capabilities
        run: |
          set -Eeuo pipefail
          trap 'code=$?; printf "blocker_stage=host-capabilities\nblocker_exit=%s\n" "$code" >>"$GATE_EVIDENCE/provenance.txt"; exit "$code"' ERR
          {
            cat /etc/os-release
            uname -srmo
            stat -fc 'cgroup_fs=%T' /sys/fs/cgroup
            cat /proc/self/cgroup
            sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
            sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          } >"$GATE_EVIDENCE/host-before.txt"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          # Ubuntu 24.04 may restrict unprivileged user namespaces by default.
          # This disposable observer host explicitly enables the product's
          # rootless boundary; failure to do so is a blocker, never a skip.
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          gate_home="${RUNNER_TEMP}/container-gate-home"
          runtime="${RUNNER_TEMP}/container-gate-runtime"
          mkdir -p "$gate_home" "$runtime"
          chmod 0700 "$gate_home" "$runtime"
          echo "GATE_HOME=$gate_home" >>"$GITHUB_ENV"
          echo "GATE_RUNTIME=$runtime" >>"$GITHUB_ENV"

      - name: Run the real fail-closed native-container gate
        run: |
          set -Eeuo pipefail
          trap 'code=$?; printf "blocker_stage=real-container-gate\nblocker_exit=%s\n" "$code" >>"$GATE_EVIDENCE/provenance.txt"; exit "$code"' ERR
          unit="asterism-container-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Delegate a real cgroup-v2 subtree to the unprivileged runner. The
          # product itself still creates and enforces every per-instance leaf.
          sudo systemd-run --quiet --wait --collect --pipe \
            --unit="$unit" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes \
            --working-directory="$GITHUB_WORKSPACE" \
            --setenv="HOME=$GATE_HOME" \
            --setenv="USER=$(id -un)" \
            --setenv="XDG_RUNTIME_DIR=$GATE_RUNTIME" \
            --setenv="ASTERISM_GATE_SOURCE_DIR=$EXACT_SOURCE" \
            --setenv="ASTERISM_GATE_EXPECTED_SHA=$TARGET_SHA" \
            --setenv="ASTERISM_GATE_EXPECTED_TREE=$TARGET_TREE" \
            --setenv="ASTERISM_GATE_OBSERVER_SHA=$GITHUB_SHA" \
            --setenv="ASTERISM_GATE_OBSERVER_REF=$GITHUB_REF" \
            --setenv="ASTERISM_GATE_WORKFLOW_REF=$GITHUB_WORKFLOW_REF" \
            --setenv="ASTERISM_GATE_RUN_ID=$GITHUB_RUN_ID" \
            --setenv="ASTERISM_GATE_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            --setenv="ASTERISM_GATE_PREFIX=$GATE_PREFIX" \
            --setenv="ASTERISM_TEST_ARTIFACTS=$GATE_EVIDENCE" \
            /usr/bin/dbus-run-session -- bash scripts/gate-container-linux.sh

      - name: Upload immutable observer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-linux-${{ env.TARGET_SHA }}-observer-${{ github.sha }}
          path: ${{ runner.temp }}/container-linux-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Remove installed host integration
        if: always()
        run: |
          if [ -n "${GATE_PREFIX:-}" ] && [ -x "${GATE_PREFIX}/bin/ast" ]; then
            ASTERISM_PREFIX="$GATE_PREFIX" ASTERISM_YES=1 \
              sh "$EXACT_SOURCE/packaging/install.sh" --uninstall
          fi
