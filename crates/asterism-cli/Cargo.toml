[package]
name = "asterism-cli"
description = "The ast CLI for Asterism: boot real VMs on machines you already own."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["personal-cloud", "vm", "distributed", "self-hosted"]
categories = ["command-line-utilities", "virtualization"]

[[bin]]
name = "ast"
path = "src/main.rs"

[dependencies]
asterism-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
libc = "0.2"
# Explicit platform features are security-critical: without them keyring's
# fallback backend is an in-memory mock, not an OS credential store.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
# `form` is the RFC 8628 body encoding: the hosted authority reads
# application/x-www-form-urlencoded on its OAuth endpoints, not JSON.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde.workspace = true
zeroize = "1"

[target.'cfg(windows)'.dependencies]
# `ast open` runs until the user interrupts it and has a closing line to
# print, so it claims the console's Ctrl-C rather than letting the default
# handler end the process mid-sentence. The same crate the core's named-pipe
# door uses; this needs one function out of it.
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
