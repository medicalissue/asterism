[package]
name = "asterism-daemon"
description = "astd, the Asterism device daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "astd"
path = "src/main.rs"

[dependencies]
asterism-core.workspace = true
asterism-mesh.workspace = true
asterism-vz.workspace = true
anyhow.workspace = true
blake3.workspace = true
# The secrets egress data plane, and every line of it is somebody else's
# maintained code. Asterism owns the policy — which authority, which handle,
# which header — and none of the transport.
#
#   hyper + hyper-util + http-body-util  the HTTP/1.1 server the guest talks
#                                        to, including framing, header caps
#                                        and the smuggling refusals
#   reqwest                              the upstream client on the source
#                                        device, with pinned DNS and
#                                        redirects switched off
#   rustls + tokio-rustls                the TLS on both sides
#   rcgen                                the per-instance CA and its leaves
#
# All of them were already in this workspace's lockfile behind iroh, so the
# egress plane adds no third-party code to the build that was not compiled
# before. See docs at the top of `egress.rs` for the licence and cost note.
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# `rustls-no-provider`, not `rustls`: the latter pulls aws-lc-rs, a second
# crypto backend with a C toolchain behind it, alongside the `ring` this tree
# already builds for iroh. This uses whichever provider the process installed,
# which `egress::init` makes `ring`.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile = "3"
