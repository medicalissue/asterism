[package]
name = "asterism-core"
description = "Asterism core types: instances, registry, daemon protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Enables only the deliberate SID-mismatch probe used by hosted Windows
# conformance. Product builds never expose an alternate admission SID.
windows-ipc-conformance = []

[dependencies]
anyhow.workspace = true
# The content address for bytes Asterism produces itself: a converted base
# image and a built OCI rootfs are about a gigabyte each and get hashed on
# adoption, which blake3 does in about a second.
blake3.workspace = true
hostname.workspace = true
# Bodies crossing the mesh are base64 in the frame rather than a JSON array
# of numbers, which is a 4x expansion against a transport with a hard frame
# cap. Already in the tree behind asterism-mesh.
data-encoding = "2"
# The canonical HTTP types. The secrets policy engine reads and writes real
# headers, and `http::HeaderMap` is the type every maintained Rust HTTP
# component in this tree already speaks — including its `set_sensitive` flag,
# which is the mechanism that keeps a credential out of a Debug line.
http = "1"
# The cow seam: clonefile(2) on macOS, ioctl(FICLONE) on Linux, and
# SEEK_DATA/SEEK_HOLE, whose two values are swapped between the two. One
# crate that computes all of it per-architecture beats constants written
# down here that would only be right on some architectures.
libc = "0.2"
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true
# Every boot input is verified against a content address before it is adopted
# (`verify`). Registries publish sha256 (and, rarely, sha512), so the check
# has to be able to compute those and not something adjacent. Already
# compiled in this tree behind ed25519-dalek, so it costs no build time — and
# it replaces shelling out to `shasum`, which was not present on every host
# and fell back to a non-cryptographic hash when it was missing.
sha2 = "0.11"
tar.workspace = true
uuid.workspace = true
# Secret material passes through this crate's types on its way to and from a
# platform store; wiping the buffer on drop is cheap and the crate is already
# in the tree behind rustls.
zeroize = "1"

[target.'cfg(windows)'.dependencies]
# The Windows local control plane is a real kernel named pipe. Tokio owns the
# overlapped server handles; windows-sys supplies the pipe ACL and peer-token
# admission primitives kept behind ipc_windows.rs.
tokio = { workspace = true, features = ["net", "sync"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
